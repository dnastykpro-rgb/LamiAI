name: Build LUMI AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Создание local.properties с API-ключом
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties

      - name: Очистка и генерация чистых XML-файлов без ошибок браузера
        run: |
          rm -f app/src/main/res/drawable/logo_lumi.png app/src/main/res/drawable/ic_launcher_lumi.xml
          python3 -c '
          import os
          os.makedirs("app/src/main/res/layout", exist_ok=True)

          manifest = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com"
              xmlns:tools="http://android.com">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <application
                  android:allowBackup="true"
                  android:label="LUMI AI"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LumiAI"
                  tools:targetApi="35">
                  <activity android:name=".ui.SplashActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".ui.MainActivity" android:exported="false" android:windowSoftInputMode="adjustResize" />
              </application>
          </manifest>"""

          splash = """<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://android.com"
              android:id="@+id/imgSplashLogo"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:alpha="0"
              android:background="@color/lumi_bg_charcoal"
              android:gravity="center"
              android:orientation="vertical">
              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:fontFamily="sans-serif-black"
                      android:letterSpacing="0.08"
                      android:text="LUMI"
                      android:textColor="@color/lumi_text_white"
                      android:textSize="48sp" />
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:fontFamily="sans-serif-black"
                      android:text="AI"
                      android:textColor="@color/lumi_crimson_red"
                      android:textSize="48sp" />
              </LinearLayout>
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:text="based at Google AI"
                  android:textColor="@color/lumi_text_secondary"
                  android:textSize="14sp" />
          </LinearLayout>"""

          with open("app/src/main/AndroidManifest.xml", "w") as f: f.write(manifest)
          with open("app/src/main/res/layout/activity_splash.xml", "w") as f: f.write(splash)
          '

      - name: Сборка APK
        run: gradle assembleDebug

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: LUMI-AI-app
          path: app/build/outputs/apk/debug/app-debug.apk
