name: Build LUMI AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Создание local.properties с API-ключом
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties

      - name: Автогенерация всех чистых XML-ресурсов
        run: |
          rm -f app/src/main/res/drawable/logo_lumi.png app/src/main/res/drawable/ic_launcher_lumi.xml
          python3 -c '
          import os, base64

          os.makedirs("app/src/main/res/layout", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)

          def w(path, b64):
              with open(path, "wb") as f:
                  f.write(base64.b64decode(b64))

          # AndroidManifest.xml
          w("app/src/main/AndroidManifest.xml", "")

          # activity_splash.xml (Programmatic clean layout)
          splash = chr(60) + """?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://android.com"
              android:id="@+id/imgSplashLogo"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:alpha="0"
              android:background="#141414"
              android:gravity="center"
              android:orientation="vertical">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="LUMI AI"
                  android:textColor="#FFFFFF"
                  android:textSize="44sp"
                  android:textStyle="bold" />
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="based at Google AI"
                  android:textColor="#E51A1A"
                  android:textSize="16sp" />
          </LinearLayout>"""
          with open("app/src/main/res/layout/activity_splash.xml", "w") as f: f.write(splash)
          '

      - name: Сборка APK
        run: gradle assembleDebug

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: LUMI-AI-app
          path: app/build/outputs/apk/debug/app-debug.apk
