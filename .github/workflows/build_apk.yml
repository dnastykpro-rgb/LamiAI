name: Build LUMI AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Создание local.properties с API-ключом
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties

      - name: Очистка и генерация чистых XML-файлов
        run: |
          rm -f app/src/main/res/drawable/logo_lumi.png app/src/main/res/drawable/ic_launcher_lumi.xml
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          echo "" | base64 -d > app/src/main/res/layout/activity_splash.xml

      - name: Сборка APK
        run: gradle assembleDebug

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: LUMI-AI-app
          path: app/build/outputs/apk/debug/app-debug.apk
